[project]
name = "caipo"
version = "0.0.0"
description = "Central Asia AI Policy Observatory: research platform for AI policy and economic transformation in Central Asia"
readme = "README.md"
# Covers CAIPO's original software only. See docs/RIGHTS_AND_LICENSING.md.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    # Long-term-support series (ADR-0001, docs/ARCHITECTURE.md §6).
    "django>=5.2,<5.3",
    # Binary wheels keep local setup free of a C toolchain. Revisit for production images.
    "psycopg[binary]>=3.3,<4",
    # Capped below 6.5 because kombu, which Celery (ADR-0004, Proposed) depends on,
    # requires redis<6.5. Raising this cap would make Celery uninstallable.
    "redis>=6.4,<6.5",
]

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]

[tool.uv]
# No importable package exists yet; this project only manages an environment.
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest assertions are the point of a test.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "services: needs the Docker Compose development services to be running",
]
