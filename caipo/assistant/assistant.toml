# The demonstrator's assistants (ADR-0025). Result-affecting: a change here is
# a reviewed change, recorded on every interaction by `pipeline_version`, and
# followed by an evaluation run (AI_ARCHITECTURE.md §9).

pipeline_version = "demo-1"

[provider]
# Chosen by the spike of 2026-11-15 (docs/reports/spike-day35-free-providers.md).
name = "groq"
# How the provider is named to the people who ask (ADR-0025 point 8).
label = "Groq"
model = "openai/gpt-oss-120b"
endpoint = "https://api.groq.com/openai/v1/chat/completions"
temperature = 0
max_output_tokens = 2048
timeout_seconds = 30

[quotas]
# Questions a day, counted in PostgreSQL by UTC day, set below the free
# tier's limits: an answer makes at most three calls (ADR-0025 point 7).
per_account_daily = 20
instance_daily = 200

[question]
# The longest question taken, in characters, after NFC.
max_length = 500

[prompts]
# The prompt files in use, by name in prompts/. A new version is a new file;
# a file in use is never edited.
query_analysis = "query-analysis-1"
synthesis_research = "synthesis-research-1"
synthesis_help = "synthesis-help-1"
support_check = "support-check-1"

[verification]
# Languages whose verification quality has been measured (AI_ARCHITECTURE.md
# §9); a statement in any other carries `language_not_evaluated`.
evaluated_languages = []

[evidence]
# How much evidence one answer may put before the model (AI_ARCHITECTURE.md §5).
help_sections = 5
segments = 5
indicators = 2
recent_years = 8
observations = 40

[timing]
# The whole answer, from the input guard to the response; past it, the
# interaction is timed out and no further call is made.
deadline_seconds = 60
# The most model calls one answer may make (ADR-0025 point 7): query
# analysis, synthesis, and one support check. A malformed synthesis is asked
# for again only if a call is left for the support check after it.
max_calls = 3
