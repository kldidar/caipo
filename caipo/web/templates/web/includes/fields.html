{% for field in form %}
  <p class="field{% if field.errors %} field--error{% endif %}{% if field.field.widget.input_type == 'checkbox' %} field--check{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}<label>{{ field }} {{ field.label }}</label>{% else %}{{ field.label_tag }}{% if field.help_text %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}{{ field }}{% endif %}
    {% for field_error in field.errors %}<span role="alert">{{ field_error }}</span>{% endfor %}
  </p>
{% endfor %}
