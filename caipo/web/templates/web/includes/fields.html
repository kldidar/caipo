{% for field in form %}
  <p class="field{% if field.errors %} field--error{% endif %}{% if field.field.widget.input_type == 'checkbox' %} field--check{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}<label>{{ field }} {{ field.label }}</label>{% else %}{{ field.label_tag }}{{ field }}{% endif %}
    {% for field_error in field.errors %}<span role="alert">{{ field_error }}</span>{% endfor %}
  </p>
{% endfor %}
