{% load i18n %}{% if chart.empty %}
  <div class="empty"><p class="empty__title">{% translate "No value is held for any country." %}</p></div>
{% else %}
  <figure class="chart">
    <svg class="chart__svg" viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="{{ title }}: {% translate 'line chart; the values are in the table below' %}">
      <g class="chart__grid" aria-hidden="true">
        {% for tick in chart.y_ticks %}<line x1="{{ chart.left }}" x2="{{ chart.right }}" y1="{{ tick.position }}" y2="{{ tick.position }}"/><text class="chart__axis" x="{{ chart.left|add:'-8' }}" y="{{ tick.position }}" text-anchor="end" dominant-baseline="middle">{{ tick.label }}</text>{% endfor %}
        {% for tick in chart.x_ticks %}<text class="chart__axis" x="{{ tick.position }}" y="{{ chart.bottom|floatformat:0|add:'18' }}" text-anchor="middle">{{ tick.label }}</text>{% endfor %}
      </g>
      {% for series in chart.series %}
        <g class="chart__series series-{{ series.index }}">
          {% for path in series.paths %}<path d="{{ path }}"/>{% endfor %}
          {% for point in series.points %}<circle cx="{{ point.x }}" cy="{{ point.y }}" r="{% if point.flagged %}4.5{% else %}4{% endif %}" class="{% if point.flagged %}is-flagged{% endif %}" tabindex="0"><title>{{ point.label }}</title></circle>{% endfor %}
          {% if series.end %}<text class="chart__label" x="{{ series.end.x|add:'10' }}" y="{{ series.label_y }}" dominant-baseline="middle">{{ series.alpha2 }}</text>{% endif %}
        </g>
      {% endfor %}
    </svg>
    <figcaption class="chart__legend">
      {% for series in chart.series %}
        <span class="legend-item series-{{ series.index }}"><span class="legend-item__swatch" aria-hidden="true"></span>{{ series.country }} <span class="muted">· {% blocktranslate with held=series.held total=series.total %}{{ held }} of {{ total }} years{% endblocktranslate %}</span></span>
      {% endfor %}
      <span class="legend-item legend-item--note"><span class="legend-item__flag" aria-hidden="true"></span>{% translate "Hollow point: estimated or provisional" %}</span>
    </figcaption>
  </figure>
{% endif %}
