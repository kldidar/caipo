# LOCAL DEVELOPMENT ONLY.
#
# This file runs the backing services a developer or a CI job needs: PostgreSQL
# and Redis. It is not the production deployment. Production (ADR-0008, Proposed)
# will add the application containers, network zones, TLS, and backups, and will
# not publish database or broker ports.
#
# All credentials come from the environment (see .env.example). Nothing here has
# a default password: Compose refuses to start if a required variable is unset.

name: caipo

services:
  postgres:
    # PostgreSQL 18, Debian-based image, pinned by tag and digest.
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Encoding and collation are set explicitly so they do not depend on the
      # image's operating system locale (docs/REPRODUCIBILITY.md §10).
      POSTGRES_INITDB_ARGS: >-
        --encoding=UTF8
        --locale-provider=builtin
        --builtin-locale=C.UTF-8
        --auth-host=scram-sha-256
    ports:
      # Loopback only: reachable from this machine, not from the network.
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # Checked over TCP so it does not pass during first-run initialisation,
      # when the server listens on the Unix socket only.
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=\"$$POSTGRES_USER\" --dbname=\"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    shm_size: 128mb
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The entrypoint starts as root to prepare the data directory, then drops
      # to the postgres user. These are the capabilities that step needs.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  redis:
    # Redis 8, pinned by tag and digest.
    image: redis:8.10.2@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
    restart: unless-stopped
    user: "999:999"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # Lets redis-cli in the health check authenticate without the password
      # appearing in its arguments.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # Redis holds only data that may be lost (ADR-0004): no persistence, no volume.
    # noeviction: a broker must refuse writes when full, not drop queued messages.
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$$REDIS_PASSWORD"
        --save ""
        --appendonly no
        --maxmemory 256mb
        --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    tmpfs:
      - /data:uid=999,gid=999,mode=0700
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
