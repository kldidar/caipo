# Spike C1: the fetch worker's only way out. Destinations are checked after
# resolution, so a public name that resolves to an internal address is refused
# as well (ADR-0011 requirement 10, independently of the application's check).
http_port 3128

acl internal_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl internal_dst dst ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8
acl web_ports port 80 443
acl CONNECT method CONNECT

http_access deny internal_dst
http_access deny !web_ports
http_access deny CONNECT !web_ports
http_access allow all

# Nothing is cached. Requests are logged in the container's own log file.
cache deny all
