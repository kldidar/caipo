name: caipo-spike-c1

x-isolated: &isolated
  build: ./worker
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "10001:10001"
  tmpfs: ["/tmp"]

services:
  # Gives the shared volumes to the unprivileged worker user, then exits.
  init:
    image: python:3.14-slim
    command: ["sh", "-c", "chown 10001:10001 /artifacts /results /landing && echo 'TEST artifact' > /artifacts/doc-1.txt && chown 10001 /artifacts/doc-1.txt"]
    volumes: ["artifacts:/artifacts", "parse_results:/results", "landing:/landing"]
    network_mode: none

  redis:
    image: redis:8.10.2@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
    command: ["redis-server", "--aclfile", "/etc/redis/users.acl"]
    volumes: ["./redis/users.acl:/etc/redis/users.acl:ro"]
    networks: [trusted, parse_net, fetch_net]

  # The fetch worker's only route out, checking destinations after resolution.
  egress:
    image: ubuntu/squid:6.6-24.04_edge
    volumes: ["./egress/squid.conf:/etc/squid/squid.conf:ro"]
    networks: [fetch_net, egress_net]

  postgres:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg
    volumes: ["./.secrets/pg:/run/secrets/pg:ro"]
    networks: [trusted]

  trusted:
    build: ./worker
    command: ["sleep", "infinity"]
    env_file: [.secrets/trusted.env]
    volumes:
      - artifacts:/artifacts
      - parse_results:/results:ro
    networks: [trusted]

  parse:
    <<: *isolated
    command: ["sleep", "infinity"]
    env_file: [.secrets/parse.env]
    volumes:
      - artifacts:/artifacts:ro
      - parse_results:/results
    networks: [parse_net]

  fetch:
    <<: *isolated
    command: ["sleep", "infinity"]
    environment:
      EGRESS_PROXY: http://egress:3128
    volumes:
      - landing:/landing
    networks: [fetch_net]

volumes:
  artifacts: {}
  parse_results: {}
  landing: {}

networks:
  trusted: {}
  # No route out: only containers on this network are reachable.
  parse_net:
    internal: true
  # No route out but through the egress proxy.
  fetch_net:
    internal: true
  egress_net: {}
